<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind – Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="game">
      <section class="player" id="player1"><h2>Player 1</h2></section>
      <aside class="controls">
        <button type="button" id="start">Start</button>
        <div>
          <div class="clock" id="clock">60</div>
          <div class="clock-label" id="clock-label">seconds left</div>
        </div>
        <div class="status" id="status" role="status"></div>
        <button type="button" class="secondary" id="new-game">New game</button>
      </aside>
      <section class="player" id="player2"><h2>Player 2</h2></section>
    </div>
  </main>
  <script src="js/scoring.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
